<html lang="en">

  <link rel="stylesheet" href="../_shared/demo.css" />
  <link rel="stylesheet" href="../_shared/relay.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- The sandbox's recorder, the LearnDash and engagement bundles, and LearnDash's fixtures. -->

  <script src="../_shared/plugins/learndash.js"></script>
  <script src="../_shared/plugins/engagement.js"></script>

<body data-page="lesson">
  <header class="nav">
    <a class="logo" href="index.html" data-go="index.html"><i aria-hidden="true"></i>Relay Academy</a>
    <nav><a href="index.html" data-go="index.html">Incident response basics</a></nav>
    <span class="learner">Signed in as a demo learner</span>
  </header>
  <main class="academy">
    <p class="crumb">Lesson 1 of 3</p>
    <h1>Writing a status update</h1>
    <div class="player">
      <span class="label">video · Writing a status update</span>
      <!-- No media file: the demo plays it by advancing time and firing the element's own play,
           timeupdate and ended events, which the engagement kit listens for. -->
      <video title="Writing a status update" preload="none" data-video></video>
      <button type="button" class="play" aria-label="Play the video" data-play-video><span data-video-icon>▶</span></button>
      <div class="progress"><i data-video-progress></i></div>
    </div>
    <p>Say what is affected, what you are doing, and when you will update next. Leave out the cause until you know it.</p>
    <p class="actions"><button type="button" class="cta" data-complete>Mark complete</button></p>
  </main>
