<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout · Northline (a demo store)</title>
  <link rel="stylesheet" href="../_shared/demo.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- The sandbox's recorder, the plugin's built CDN bundle, and its recorded fixtures. -->
  <script src="../_shared/runtime.js"></script>
  <script src="../_shared/plugins/shopify.js"></script>
  <script src="../_shared/fixtures/shopify.js"></script>
  <script type="module" src="demo.js"></script>
</head>
<body data-page="checkout">
  <header class="top">
    <a class="logo" href="index.html">Northline</a>
    <nav><a href="index.html">Sale</a><a href="#about">About</a></nav>
    <label class="search"><span class="visually-hidden">Search products</span><input type="search" placeholder="Search products" data-search /></label>
    <a class="cart-link" href="cart.html" data-cart-link>Cart (<span data-cart-count>0</span>)</a>
  </header>
  <main>
    <h1>Checkout</h1>
    <div class="checkout">
      <form data-checkout-form>
        <fieldset>
          <legend>Shipping method</legend>
          <label class="choice"><input type="radio" name="ship" value="Ground" data-ship="Ground" /> Ground <span>$4.95</span></label>
          <label class="choice"><input type="radio" name="ship" value="Express" data-ship="Express" /> Express <span>$14.00</span></label>
        </fieldset>
        <fieldset>
          <legend>Payment</legend>
          <label class="choice"><input type="radio" name="pay" value="paypal" data-pay="paypal" /> PayPal</label>
          <label class="choice"><input type="radio" name="pay" value="card" data-pay="card" /> Credit card</label>
          <div class="card" data-card hidden>
            <!-- Filled on purpose: no plugin reads a DOM input, and this shows it. -->
            <label>Card number <input readonly value="4242 4242 4242 4242" autocomplete="off" /></label>
            <label>Expiry <input readonly value="12 / 29" autocomplete="off" /></label>
            <label>CVC <input readonly value="123" autocomplete="off" /></label>
          </div>
        </fieldset>
        <a class="primary" href="thank-you.html" data-place-order>Pay now</a>
      </form>
      <aside class="summary" data-order-summary></aside>
    </div>
  </main>
</body>
</html>
